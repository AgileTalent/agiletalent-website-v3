<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>HR Consulting & Recruitment Services in Nigeria | AgileTalent Associates</title>
  <meta name="description" content="AgileTalent Associates helps Nigerian organisations recruit better talent, strengthen HR systems, manage payroll and develop workforce capability.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://agiletalentassociates.com/services.html">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <meta property="og:title" content="Our Services | AgileTalent Associates Limited">
  <meta property="og:description" content="Practical recruitment, HR and workforce solutions for organisations in Nigeria.">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --f-head: 'Inter', sans-serif;
      --f-body: 'Inter', sans-serif;
    }

    body {
      font-family: var(--f-body);
    }

    h1, h2, h3, h4, .brand, .btn {
      font-family: var(--f-head);
    }

    .services-hero {
      position: relative;
      overflow: hidden;
      padding-top: clamp(80px, 11vw, 145px);
      padding-bottom: clamp(80px, 10vw, 125px);
      background: #0B1426;
      color: #fff;
    }

    .services-hero::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      right: -100px;
      top: 5%;
      border: 1px solid rgba(242,183,5,.32);
      border-radius: 50%;
      box-shadow:
        0 0 0 42px rgba(242,183,5,.035),
        0 0 0 84px rgba(242,183,5,.025);
      pointer-events: none;
    }

    .services-hero .wrap {
      position: relative;
      z-index: 1;
    }

    .services-hero h1 {
      max-width: 900px;
      font-size: clamp(2.8rem, 6.5vw, 5.4rem);
      line-height: 1.06;
      letter-spacing: -.055em;
      margin: 18px 0 24px;
    }

    .services-hero h1 span {
      color: #F2B705;
    }

    .services-hero .lead {
      max-width: 690px;
      line-height: 1.8;
    }

    .service-hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 38px;
      color: rgba(255,255,255,.78);
      font-size: .92rem;
    }

    .service-hero-meta span::before {
      content: "—";
      color: #F2B705;
      margin-right: 9px;
    }

    .service-overview {
      padding-top: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid rgba(11,20,38,.12);
    }

    .service-overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 26px;
    }

    .service-overview-item {
      padding-right: 18px;
    }

    .service-overview-item strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.02rem;
    }

    .service-overview-item p {
      margin: 0;
      font-size: .94rem;
      line-height: 1.7;
    }

    .service-intro {
      max-width: 760px;
      margin-bottom: 52px;
    }

    .service-intro h2 {
      font-size: clamp(2rem,4vw,3.2rem);
      line-height: 1.15;
      letter-spacing: -.04em;
      margin: 12px 0 18px;
    }

    .service-row {
      display: grid;
      grid-template-columns: 100px minmax(0,1fr) minmax(230px,.75fr);
      gap: 30px;
      align-items: start;
      padding: 38px 0;
      border-top: 1px solid rgba(11,20,38,.15);
    }

    .service-index {
      color: #B48500;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .08em;
      padding-top: 7px;
    }

    .service-main h3 {
      font-size: clamp(1.45rem,2.4vw,2rem);
      line-height: 1.25;
      letter-spacing: -.035em;
      margin: 0 0 14px;
    }

    .service-main p {
      line-height: 1.8;
      margin-bottom: 18px;
    }

    .service-main .text-link {
      display: inline-block;
      margin-top: 4px;
    }

    .service-outcome {
      padding: 23px;
      border-radius: 12px;
      background: #FAF8F3;
    }

    .service-outcome .outcome-label {
      display: block;
      margin-bottom: 13px;
      color: #806000;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .service-outcome p {
      margin: 0;
      line-height: 1.75;
      font-size: .94rem;
    }

    .service-outcome ul {
      padding-left: 18px;
      margin: 0;
    }

    .service-outcome li {
      margin: 8px 0;
      line-height: 1.55;
      font-size: .93rem;
    }

    .service-proof {
      background: #0B1426;
      color: #fff;
      overflow: hidden;
    }

    .service-proof-grid {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 56px;
      align-items: center;
    }

    .proof-number {
      display: block;
      color: #F2B705;
      font-size: clamp(3.8rem,8vw,7rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: 1;
      margin-bottom: 18px;
    }

    .service-proof h2 {
      font-size: clamp(2rem,4vw,3.1rem);
      line-height: 1.15;
      letter-spacing: -.04em;
      margin: 14px 0 20px;
    }

    .service-proof p {
      line-height: 1.8;
    }

    .proof-note {
      padding: 25px;
      border: 1px solid rgba(255,255,255,.19);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
    }

    .proof-note h3 {
      margin-top: 0;
    }

    .proof-note p:last-child {
      margin-bottom: 0;
    }

    .service-process-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 28px;
      margin-top: 42px;
    }

    .process-item {
      padding-top: 22px;
      border-top: 2px solid #F2B705;
    }

    .process-item .step {
      display: block;
      color: #947000;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      margin-bottom: 18px;
    }

    .process-item h3 {
      margin-bottom: 10px;
    }

    .process-item p {
      line-height: 1.75;
      margin-bottom: 0;
    }

    .service-final-cta {
      background: #FAF8F3;
    }

    .service-final-cta h2 {
      max-width: 760px;
      font-size: clamp(2.2rem,4.5vw,3.8rem);
      line-height: 1.12;
      letter-spacing: -.045em;
      margin: 12px 0 20px;
    }

    .service-final-cta .lead {
      max-width: 680px;
      line-height: 1.8;
    }

    .service-contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 26px;
      margin-top: 26px;
    }

    .service-contact-links a {
      overflow-wrap: anywhere;
    }

    @media (max-width: 900px) {
      .service-row {
        grid-template-columns: 55px minmax(0,1fr);
        gap: 18px;
      }

      .service-outcome {
        grid-column: 2;
      }

      .service-proof-grid {
        gap: 30px;
      }
    }

    @media (max-width: 650px) {
      .services-hero::after {
        right: -230px;
        top: 30%;
      }

      .service-overview-grid,
      .service-proof-grid,
      .service-process-grid {
        grid-template-columns: 1fr;
        gap: 26px;
      }

      .service-overview-item {
        padding-right: 0;
      }

      .service-row {
        grid-template-columns: 36px minmax(0,1fr);
        gap: 12px;
        padding: 30px 0;
      }

      .service-outcome {
        grid-column: 2;
        padding: 20px;
      }

      .service-intro {
        margin-bottom: 34px;
      }

      .service-contact-links {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
